fail_fast: true

repos:
  - repo: local
    hooks:
      - id: bench-commit-msg
        name: require bench
        language: pygrep
        entry: '(?i)^bench(?::|\s)+\d+'
        args:
          - --multiline
          - --negate
        stages:
          - commit-msg

      - id: go-vet
        name: go vet
        description: run go vet before pushing
        language: system
        files: \.go$
        pass_filenames: false
        entry: go
        args: ["vet", "./..."]
        stages: [pre-push]

      - id: go-test
        name: go test
        description: run tests before pushing
        language: system
        files: \.go$
        pass_filenames: false
        entry: go
        args: ["test", "./..."]
        stages: [pre-push]
